<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users table</title>

    <link rel="stylesheet" href="./populaterUser.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
</head>

<body>

    <header>
        <div class="title">
            
            <h1>User Directory</h1>
            <p>Agust 19, 2026</p>
        </div>

        <div class="search">
            <i class="fa-solid fa-magnifying-glass" style="color: rgb(128, 128, 128);"></i>
            <input type="text" placeholder="Seach users...">
        </div>
    </header>

    <main>
        <table>
            <thead>
                <tr>
                    <th>Index</th>
                    <th>FirstName</th>
                    <th>LastName</th>
                    <th>Email</th>
                    <th>UserName</th>
                    <th>Address</th>
                    <th colspan="2">Action</th>
                </tr>
            </thead>

            <tbody>
                <!-- -->
            </tbody>
        </table>
    </main>

    <script src="./populaterUser.js"></script>

</body>

</html>
