
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <link rel="stylesheet" href="./card.css">
</head>

<body>

    <div class="product-card">

        
        <div class="image-box">
            <img src="./img/headsent.png" alt="">
        </div>

        
        <div class="product-info">

            <h2>Sony WH-1000XM5</h2>

            <div class="rating">  
                ★★★★★    
                <span>(1,20 Reviews)</span>
            </div>

            <h3>$349.99</h3>

            <p>
                Industry-leading noise cancelling headphones
                with amazing sound quality and comfortable design.
            </p>

            <button>
                Add to cart 🛒
            </button>

        </div>
  
    </div>
<script src="./card.js"></script>
</body>
</html>
