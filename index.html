<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umugani w'u Rwanda - Flip Card</title>
    <style>
        /* Kuno ni ho tubikira imiterere (CSS) */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Iki ni ikigega cy'ikarita gituma ibasha kuba 3D */
        .card-container {
            perspective: 1000px;
        }

        .card {
            width: 320px;
            height: 450px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }

        /* Iyo mouse igeze hejuru, ikarita irahindukira */
        .card-container:hover .card {
            transform: rotateY(180deg);
        }

        /* Imiterere rusange y'amabali yombi y'ikarita */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Kugira ngo inyuma h'ikarita itagaragara imbere */
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
        }

        /* URUHANDE RW'IMBERE (Front) */
        .card-front {
            background: linear-gradient(145deg, #fdfbfb, #ebedee);
            color: #333;
        }

        .card-front h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c5364;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card-front .icon {
            font-size: 70px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        .card-front p {
            font-size: 16px;
            color: #666;
            font-style: italic;
        }

        /* URUHANDE RW'INYUMA (Back) */
        .card-back {
            background: linear-gradient(145deg, #ff9966, #ff5e62);
            color: #fff;
            transform: rotateY(180deg); /* Kugira ngo inyuma ibe ari ho hahanditse */
        }

        .card-back .proverb {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.4;
            border-bottom: 2px solid rgba(255,255,255,0.4);
            padding-bottom: 15px;
        }

        .card-back .meaning {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.95;
        }

        /* Animation y'akamenyetso (Icon) */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <!-- Iki ni igice cya HTML -->
    <div class="card-container">
        <div class="card">
            <!-- Imbere h'ikarita -->
            <div class="card-face card-front">
                <div class="icon">📜</div>
                <h1>Umugani</h1>
                <p>Shyira mouse yawe hano kugira ngo uhindukize ikarita ubone umugani!</p>
            </div>
            
            <!-- Inyuma h'ikarita -->
            <div class="card-face card-back">
                <p class="proverb">"Igiti kigororwa kikiri gito."</p>
                <p class="meaning">Ibi bivuze ko umuntu agomba kwigishwa, guhugurwa no guhabwa indangagaciro akiri muto, kugira ngo azagire ubuzima bwiza kandi butunganye ejo hazaza.</p>
            </div>
        </div>
    </div>

</body>
</html>
